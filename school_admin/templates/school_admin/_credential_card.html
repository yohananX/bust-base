{# Printable credential card. Expects `slip` = {user, password} in context. #}
<article class="card">
  <div class="card-logo-wrap">
    {% if request.school.logo %}
      <img class="card-logo" src="{{ request.school.logo.url }}" alt="{{ request.school.name }} logo">
    {% else %}
      <span class="monogram">{{ request.school.short_code|slice:":1"|upper }}</span>
    {% endif %}
  </div>
  <div class="creds">
    <div class="field">
      <span class="label">Username</span>
      <span class="value">{{ slip.user.username }}</span>
    </div>
    <div class="field password">
      <span class="label">Password</span>
      <span class="value">{{ slip.password }}</span>
    </div>
    <div class="field" style="margin-top: 1mm;">
      <span class="label">First login</span>
      <span class="value" style="font-family: inherit; font-size: 8px; color: #4b5563; word-break: normal;">
        You'll be asked to set your own password.
      </span>
    </div>
  </div>
  <button type="button" class="copy-btn no-print"
          data-username="{{ slip.user.username }}"
          data-password="{{ slip.password }}"
          onclick="copyCard(this)">Copy</button>
</article>
