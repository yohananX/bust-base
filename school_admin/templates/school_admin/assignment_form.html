{% extends 'school_admin/base_admin.html' %}
{% load static %}

{% block title %}Create Assignment — School Admin{% endblock %}
{% block page_header %}Create Teacher Assignment{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center">
        <i data-lucide="user-round" class="w-5 h-5"></i>
      </div>
      <p class="text-sm text-gray-600">Assign a subject and class to a teacher.</p>
    </div>
    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Teacher</label>
        <input type="text" value="{{ teacher.get_full_name|default:teacher.username }}" disabled
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Subject <span class="text-red-500">*</span></label>
        <select name="subject_id" required
                class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-900 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white outline-none transition-all">
          <option value="">— Select Subject —</option>
          {% for s in subjects %}
            <option value="{{ s.id }}">{{ s.name }} ({{ s.code }})</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Class <span class="text-red-500">*</span></label>
        <select name="class_id" required
                class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-900 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white outline-none transition-all">
          <option value="">— Select Class —</option>
          {% for c in classes %}
            <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Session <span class="text-red-500">*</span></label>
        <select name="session_id" required
                class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-900 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white outline-none transition-all">
          <option value="">— Select Session —</option>
          {% for s in sessions %}
            <option value="{{ s.id }}" {% if s.is_current %}selected{% endif %}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex items-center gap-4 pt-2">
        <button type="submit"
                class="inline-flex items-center px-6 py-2.5 bg-primary hover:bg-primary-hover text-white text-sm font-medium rounded-xl transition-colors shadow-sm">
          <i data-lucide="check" class="w-4 h-4 mr-2"></i>Create Assignment
        </button>
        <a href="{% url 'school_admin:assignment_list' %}" class="text-sm font-medium text-gray-600 hover:text-gray-800 transition-colors">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
