{% if class_subjects %}
<div class="flex flex-wrap gap-2">
  {% for cs in class_subjects %}
  <label class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm border transition-colors cursor-pointer
    {% if cs.pk in assigned_class_subject_ids %}
      bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed
    {% else %}
      bg-white border-gray-300 text-gray-700 hover:border-primary hover:bg-violet-50
    {% endif %}">
    {% if cs.pk in assigned_class_subject_ids %}
      <input type="checkbox" name="class_subject_ids" value="{{ cs.pk }}" disabled class="sr-only">
      <span class="text-emerald-500 text-xs"><i data-lucide="check" class="w-3 h-3"></i></span>
      <span>{{ cs.subject.name }}</span>
      <span class="text-xs text-gray-400">(assigned)</span>
    {% else %}
      <input type="checkbox" name="class_subject_ids" value="{{ cs.pk }}" class="sr-only peer">
      <span class="w-3.5 h-3.5 rounded border border-gray-300 flex items-center justify-center
        peer-checked:bg-primary peer-checked:border-primary peer-checked:text-white transition-colors">
        <svg class="w-2.5 h-2.5 hidden peer-checked:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </span>
      <span class="peer-checked:text-primary peer-checked:font-medium">{{ cs.subject.name }}</span>
    {% endif %}
  </label>
  {% endfor %}
</div>
{% else %}
<p class="text-xs text-gray-400 italic">No subjects configured for this class offering.</p>
{% endif %}
