{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_header %}Change Password{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 max-w-md">
    <div class="w-11 h-11 rounded-xl bg-primary/10 text-primary flex items-center justify-center mb-4">
      <i data-lucide="key-round" class="w-5 h-5"></i>
    </div>
    <form method="post">
      {% csrf_token %}

      <div class="mb-4">
        <label for="current_password" class="block text-xs font-medium text-gray-500 mb-1.5">Current Password</label>
        <input type="password" id="current_password" name="current_password" required
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white outline-none transition-all">
      </div>

      <div class="mb-4">
        <label for="new_password" class="block text-xs font-medium text-gray-500 mb-1.5">New Password</label>
        <input type="password" id="new_password" name="new_password" required
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white outline-none transition-all">
      </div>

      <div class="mb-6">
        <label for="confirm_password" class="block text-xs font-medium text-gray-500 mb-1.5">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required
               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:bg-white outline-none transition-all">
      </div>

      <button type="submit"
              class="inline-flex items-center justify-center w-full px-4 py-2.5 bg-primary hover:bg-primary-hover text-white text-sm font-medium rounded-xl transition-colors shadow-sm">
        <i data-lucide="key-round" class="w-4 h-4 mr-2"></i>Change Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
