{% if href %}
<a href="{{ href }}" {% if attrs %}{{ attrs|safe }}{% endif %}
   class="inline-flex items-center px-4 py-2.5 bg-primary hover:bg-primary-hover text-white text-sm font-medium rounded-xl transition-colors shadow-sm hover:shadow">
    {% if icon %}<i data-lucide="{{ icon }}" class="w-4 h-4 mr-2"></i>{% endif %}
    {{ text }}
</a>
{% else %}
<button {% if attrs %}{{ attrs|safe }}{% endif %}
    class="inline-flex items-center px-4 py-2.5 bg-primary hover:bg-primary-hover text-white text-sm font-medium rounded-xl transition-colors shadow-sm hover:shadow">
    {% if icon %}<i data-lucide="{{ icon }}" class="w-4 h-4 mr-2"></i>{% endif %}
    {{ text }}
</button>
{% endif %}
