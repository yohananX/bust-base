<div class="{% if color == 'purple' %}card-purple{% elif color == 'blue' %}card-blue{% elif color == 'orange' %}card-orange{% elif color == 'green' %}card-green{% else %}bg-white{% endif %} rounded-2xl p-5 flex items-center justify-between">
    <div class="min-w-0">
        <p class="text-sm text-gray-600 mb-1">{{ label }}</p>
        <p class="text-2xl font-bold text-gray-900 truncate">{{ prefix }}{{ value }}</p>
    </div>
    <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0
        {% if color == 'purple' %}bg-violet-200/50 text-violet-600
        {% elif color == 'blue' %}bg-sky-200/50 text-sky-600
        {% elif color == 'orange' %}bg-orange-200/50 text-orange-600
        {% elif color == 'green' %}bg-emerald-200/50 text-emerald-600
        {% else %}bg-gray-100 text-gray-600{% endif %}">
        <i data-lucide="{{ icon }}" class="w-5 h-5"></i>
    </div>
</div>
