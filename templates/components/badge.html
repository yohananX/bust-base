<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
    {% if status == 'success' %}bg-success-tint text-success border border-line
    {% elif status == 'warning' %}bg-warning-tint text-warning border border-line
    {% elif status == 'danger' %}bg-danger-tint text-danger border border-line
    {% elif status == 'info' %}bg-info-tint text-info border border-line
    {% else %}bg-surface-muted text-ink-muted border border-line{% endif %}">
    {% if status == 'success' %}<span class="w-1.5 h-1.5 rounded-full bg-success mr-1.5"></span>
    {% elif status == 'warning' %}<span class="w-1.5 h-1.5 rounded-full bg-warning mr-1.5"></span>
    {% elif status == 'danger' %}<span class="w-1.5 h-1.5 rounded-full bg-danger mr-1.5"></span>
    {% elif status == 'info' %}<span class="w-1.5 h-1.5 rounded-full bg-info mr-1.5"></span>
    {% endif %}
    {{ text }}
</span>
