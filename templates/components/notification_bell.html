<div id="notification-bell" class="relative">
  <button
    id="bell-btn"
    type="button"
    class="relative p-2 rounded-lg text-ink-muted hover:text-ink hover:bg-surface-muted transition-colors"
    aria-label="Notifications"
    aria-haspopup="true"
    aria-expanded="false"
  >
    <i data-lucide="bell" class="w-5 h-5"></i>
    <span
      id="bell-badge"
      class="hidden absolute -top-0.5 -right-0.5 items-center justify-center w-5 h-5 rounded-full bg-danger text-white text-[10px] font-bold leading-none"
    ></span>
  </button>
  <div
    id="bell-dropdown"
    class="hidden absolute right-0 mt-2 w-80 bg-white rounded-xl border border-line shadow-lg z-50 overflow-hidden"
  ></div>
</div>
